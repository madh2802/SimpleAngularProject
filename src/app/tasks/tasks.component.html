<section id="tasks">
    <header>
        <h2>{{name}}'s Tasks</h2>
        <menu>
            <button (click)="onCreatetask()">Add task</button>
        </menu>
    </header>

    <ul>
        @for (task of selectedUserTasks; track task.id) {
            <li>
                <app-task [task]="task"/>
            </li>
        }
            
    </ul>
    @if (isCreateTaskClicked) {
        <app-create-task [userId]="userId" (close)="onClickCancel()" />
    }
</section>
